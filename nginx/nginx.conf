events {
    worker_connections 1024;
}

http {
    # --------------------------------------------------------
    # TIER 1: PUBLIC INTERNET ACCESS (Routed via Funnel)
    # --------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Expose ONLY the NiceGUI frontend
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Explicitly block access to backend paths on the public port
        location /api/ {
            return 403;
        }
        location /pgadmin/ {
            return 403;
        }
    }

    # --------------------------------------------------------
    # TIER 2: PRIVATE VPN ACCESS (Routed via Serve)
    # --------------------------------------------------------
    server {
        listen 81;
        server_name _;

        # Frontend access
        location / {
            proxy_pass http://frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # FastAPI Backend access (maintains the /api/ path)
        location /api/ {
            proxy_pass http://api:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # pgAdmin access (requires X-Script-Name header for sub-path routing)
        location /pgadmin/ {
            proxy_pass http://db-web:5050/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_redirect off;
        }
    }
}