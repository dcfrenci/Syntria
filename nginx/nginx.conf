worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;     # Docker DNS: survives container IP changes
    client_max_body_size 10m;                   # 2 MB preset images, CSV imports
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; '' $scheme; }

    limit_req_zone  $binary_remote_addr zone=perip:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=connperip:10m;

    # Trust the hop in front of us (Tailscale container / Docker gateway) for the client IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;       # NiceGUI = Socket.IO / WebSocket
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 3600s;                               # don't kill idle UI sockets at 60 s
    proxy_send_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ---------- TIER 1: public (Funnel / localhost:8080): the app only ----------
    server {
        listen 80;
        server_name _;

        location = /nginx-health { access_log off; return 200 "ok\n"; }

        location /api/     { return 403; }
        location /pgadmin/ { return 403; }

        location / {
            limit_req  zone=perip burst=60 nodelay;
            limit_conn connperip 30;
            set $fe http://frontend:8080;
            proxy_pass $fe;
        }
    }

    # ---------- TIER 2: private (tailnet / localhost:8081): app + API + pgAdmin ----------
    server {
        listen 81;
        server_name _;

        location / {
            set $fe http://frontend:8080;
            proxy_pass $fe;
        }

        location /api/ {
            set $api http://api:8000;
            proxy_pass $api;                     # URI is preserved, so /api/v1/... reaches FastAPI
        }

        location /pgadmin/ {
            set $pg http://db-web:5050;
            rewrite ^/pgadmin/(.*)$ /$1 break;
            proxy_pass $pg;
            proxy_redirect off;
            # re-declared on purpose (see note above)
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Script-Name     /pgadmin;
        }
    }
}