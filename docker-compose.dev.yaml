services:
  nginx:
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8081:81"
      - "127.0.0.1:8082:82"

  api:
    volumes:
      - ./api/app:/app/app
      - ./api/migrations:/app/migrations
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${FASTAPI_PORT} --proxy-headers --reload --reload-dir /app/app
    environment:
      ENABLE_DOCS: "true"
      
  frontend:
    volumes:
      - ./frontend:/app
    environment:
      NICEGUI_RELOAD: "true"