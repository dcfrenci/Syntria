x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"


services:
  db:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPORT: ${POSTGRES_PORT}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 15s
      timeout: 5s
      retries: 5
    stop_grace_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks: [syntria]

  db-web:
    image: ${PGADMIN_IMAGE}
    profiles: ["tools"]
    restart: unless-stopped
    logging: *logging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_LISTEN_PORT}
    expose:
      - "${PGADMIN_LISTEN_PORT}"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
    networks: [syntria]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      FASTAPI_PORT: ${FASTAPI_PORT}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    expose:
      - "${FASTAPI_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${FASTAPI_PORT}/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks: [syntria]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    restart: unless-stopped
    logging: *logging
    environment:
      API_BASE_URL: ${API_BASE_URL}
      NICEGUI_PORT: ${NICEGUI_PORT}
      NICEGUI_STORAGE_SECRET: ${NICEGUI_STORAGE_SECRET}
      NICEGUI_STORAGE_PATH: /data/nicegui
      NICEGUI_RELOAD: "false"
      NICEGUI_HTTPS_ONLY: ${NICEGUI_HTTPS_ONLY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - nicegui_data:/data/nicegui
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp
    expose:
      - "${NICEGUI_PORT}"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', ${NICEGUI_PORT}), 3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    networks: [syntria]

  nginx:
    image: ${NGINX_IMAGE}
    restart: unless-stopped
    logging: *logging
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64M }
    networks: [syntria]

  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE}
    restart: unless-stopped
    logging: *logging
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      HOME: /tmp
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
      POSTGRES_PORT: ${POSTGRES_PORT}
      ALLOW_PLAINTEXT_BACKUP: ${ALLOW_PLAINTEXT_BACKUP:-false}
    volumes:
      - ./backups:/backups
      - ./backup/rclone:/config/rclone
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'syntria-*' -mmin -$$((BACKUP_INTERVAL_HOURS*60+120)) | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 2m
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    networks: [syntria]

  tailscale:
    image: ${TAILSCALE_IMAGE}
    container_name: ${TAILSCALE_CONTAINER_NAME}
    hostname: ${TAILSCALE_HOSTNAME}
    profiles: ["tailscale"]
    logging: *logging
    environment:
      TS_AUTHKEY: file:/run/secrets/ts_authkey
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_data:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    networks: [syntria]

volumes:
  postgres_data:
  nicegui_data:
  tailscale_data:

networks:
  syntria:
    driver: bridge