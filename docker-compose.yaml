services:
  db:
    image: ${POSTGRES_IMAGE}
    container_name: ${POSTGRES_CONTAINER_NAME}
    restart: always
    env_file:
      - .env
    environment:
      PGPORT: ${POSTGRES_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_PORT}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - syntria

  db-web:
    image: ${PGADMIN_IMAGE}
    container_name: ${PGADMIN_CONTAINER_NAME}
    restart: always
    env_file:
      - .env
    expose:
      - "${PGADMIN_LISTEN_PORT}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - syntria

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: ${FASTAPI_CONTAINER_NAME}
    restart: always
    env_file:
      - .env
    volumes:
      - ./api/app:/app/app
    expose:
      - "${FASTAPI_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${FASTAPI_PORT}/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - syntria

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    container_name: ${NICEGUI_CONTAINER_NAME}
    restart: always
    env_file:
      - .env
    volumes:
      - ./frontend:/app
    expose:
      - "${NICEGUI_PORT}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - syntria

  nginx:
    image: ${NGINX_IMAGE}
    container_name: ${NGINX_CONTAINER_NAME}
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api
      - db-web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:80/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - syntria

  backup:
    build: 
      context: ./backup
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION}
    restart: unless-stopped
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      HOME: /tmp
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG: /config/rclone/rclone.conf
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    volumes:
      - ./backups:/backups
      - ./backup/rclone:/config/rclone
    read_only: true
    tmpfs:
      - /tmp
    # cap_drop: [ALL]
    # security_opt:
    #   - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # unhealthy if there is no backup newer than interval + 2h
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'syntria-*' -mmin -$$((BACKUP_INTERVAL_HOURS*60+120)) | grep -q ."]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 15m
    networks:
      - syntria

  tailscale:
    image: ${TAILSCALE_IMAGE}
    container_name: ${TAILSCALE_CONTAINER_NAME}
    hostname: ${TAILSCALE_HOSTNAME}
    # [step1] Only started when COMPOSE_PROFILES=tailscale (production). Local runs skip it.
    profiles: ["tailscale"]
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale_data:/var/lib/tailscale
    cap_add:
      - net_admin
      - net_raw
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - syntria

volumes:
  postgres_data:
    driver: local
  tailscale_data:
    driver: local

networks:
  syntria:
    driver: bridge