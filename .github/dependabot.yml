version: 2
updates:
  # Maintain GitHub Actions pinned commit SHAs
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain Python dependencies
  - package-ecosystem: "pip"
    directory: "/api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"

  # Maintain Docker base images & compose setups
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"