name: ci

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: tttttttttttttttt
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.x
      - uses: actions/setup-python@0b9264197022ca95e263d9134a65ef84ed97efd6 # v6.x
        with: { python-version: "3.12" }
      - run: pip install ruff==0.9.0 pip-audit==2.7.3 bandit==1.8.0 pytest==8.3.4 pytest-asyncio==0.23.5 -r api/requirements.lock
      - run: ruff check --select E9,F63,F7,F82 api frontend scripts
      - run: pip-audit -r api/requirements.lock
      - run: pip-audit -r frontend/requirements.lock
      - run: bandit -r api/app frontend/app -ll -q
      - run: cd api && python -m pytest -q tests
      - uses: aquasecurity/trivy-action@18f2510ee396bbf400e00949f2393b915647f201 # v0.29.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  integration:
    runs-on: ubuntu-24.04
    env:
      ADMIN_EMAIL: ci-admin@example.com
      COMPOSE_FILE: docker-compose.yaml:docker-compose.test.yaml
      COMPOSE_PROFILES: ""
      API_BASE_URL: http://127.0.0.1:18081/api/v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: ./scripts/gen-env.sh
      - run: |
          echo "ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          echo "DEMO_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: docker compose up -d --build --wait --wait-timeout 240 nginx
      - run: docker compose exec -T -e ADMIN_PASSWORD api python -m app.cli bootstrap
      - run: docker compose exec -T api alembic check
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/initialize.py --pre-filled && python scripts/role_testing.py
      - if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v